name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon run examples/demo --target ${{ matrix.target }}
      - run: moon run examples/advanced --target ${{ matrix.target }}
      - if: matrix.target == 'js'
        run: moon build --target js --release
      - if: matrix.target == 'js'
        run: node scripts/test-cli.cjs
      - if: matrix.target == 'js'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.target == 'js'
        run: python -m pip install vdf==3.4
      - if: matrix.target == 'js'
        run: python scripts/check-reference.py
      - if: matrix.target == 'js'
        run: node scripts/benchmark.cjs
      - if: matrix.target == 'native'
        run: moon build --target native --release
      - if: matrix.target == 'native'
        run: node scripts/test-cli.cjs --native
      - if: matrix.target == 'native'
        run: node scripts/benchmark.cjs --native

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon check --target js
      - run: moon test --target js
      - run: moon build --target js --release
      - run: node scripts/test-cli.cjs
      - run: moon check --target native
      - run: moon test --target native
      - run: moon build --target native --release
      - run: node scripts/test-cli.cjs --native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install vdf==3.4
      - run: python scripts/check-reference.py --native

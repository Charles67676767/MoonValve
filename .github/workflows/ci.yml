name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon check --target ${{ matrix.target }}
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }}
      - run: moon run examples/demo --target ${{ matrix.target }}
      - if: matrix.target == 'js'
        run: moon build --target js --release
      - if: matrix.target == 'js'
        run: node scripts/test-cli.cjs

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon check --target js
      - run: moon test --target js
      - run: moon build --target js --release
      - run: node scripts/test-cli.cjs

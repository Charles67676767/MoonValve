name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon version --all
      - run: moon fmt --check
      - run: moon info
      - run: node scripts/check-api.cjs
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }}
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run examples/demo --target ${{ matrix.target }}
      - run: moon run examples/advanced --target ${{ matrix.target }}
      - if: matrix.target == 'js'
        run: moon build --target js --release
      - if: matrix.target == 'js'
        run: node scripts/test-cli.cjs
      - if: matrix.target == 'js'
        run: node scripts/test-lsp.cjs
      - if: matrix.target == 'js'
        run: node scripts/test-extension.cjs
      - if: matrix.target == 'js'
        run: node scripts/test-stream-pipe.cjs
      - if: matrix.target == 'js'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.target == 'js'
        run: python -m pip install vdf==3.4
      - if: matrix.target == 'js'
        run: python scripts/check-reference.py
      - if: matrix.target == 'js'
        run: node scripts/benchmark.cjs
      - if: matrix.target == 'native'
        run: moon build --target native --release
      - if: matrix.target == 'native'
        run: node scripts/test-cli.cjs --native
      - if: matrix.target == 'native'
        run: node scripts/test-lsp.cjs --native
      - if: matrix.target == 'native'
        run: node scripts/test-stream-pipe.cjs --native
      - if: matrix.target == 'native'
        run: node scripts/benchmark.cjs --native
      - if: matrix.target == 'native'
        run: moon run examples/streaming --target native --release
      - if: matrix.target == 'native'
        run: moon -C integration/consumer run cmd/main --target native
      - if: matrix.target == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.target == 'native'
        run: moon build --target js --release
      - if: matrix.target == 'native'
        run: node scripts/build-editor.cjs
      - if: matrix.target == 'native'
        run: node scripts/test-editor.cjs
      - if: matrix.target == 'native'
        run: node scripts/check-upstream.cjs
      - if: matrix.target == 'native'
        run: node scripts/benchmark-edits.cjs
      - if: matrix.target == 'native'
        run: npm ci --ignore-scripts
        working-directory: extensions/vscode
      - if: matrix.target == 'native'
        run: node scripts/package-extension.cjs
      - if: matrix.target == 'native'
        run: node scripts/package.cjs
      - if: matrix.target == 'native'
        run: python scripts/test-package.py
      - if: matrix.target == 'native'
        uses: actions/upload-artifact@v4
        with:
          name: moonvalve-linux-x64
          path: |
            _build/packages/*.zip
            _build/packages/*.sha256

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - run: moon check --target js
      - run: moon test --target js
      - run: moon build --target js --release
      - run: node scripts/test-cli.cjs
      - run: node scripts/test-lsp.cjs
      - run: node scripts/test-extension.cjs
      - run: node scripts/test-stream-pipe.cjs
      - run: moon check --target native
      - run: moon test --target native
      - run: moon build --target native --release
      - run: node scripts/test-cli.cjs --native
      - run: node scripts/test-lsp.cjs --native
      - run: node scripts/test-stream-pipe.cjs --native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install vdf==3.4
      - run: python scripts/check-reference.py --native
      - run: node scripts/build-editor.cjs
      - run: node scripts/test-editor.cjs
      - run: node scripts/check-upstream.cjs
      - run: npm ci --ignore-scripts
        working-directory: extensions/vscode
      - run: node scripts/package-extension.cjs
      - run: node scripts/test-vscode.cjs
      - run: node scripts/package.cjs
      - run: python scripts/test-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: moonvalve-windows-x64
          path: |
            _build/packages/*.zip
            _build/packages/*.sha256

  reference-and-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hustcer/setup-moonbit@v1
        with:
          version: '0.10.14+7d59c7ec9'
          core-version: '0.10.14+7d59c7ec9'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: node scripts/build-editor.cjs
      - run: dotnet restore tools/reference-dotnet/Reference.csproj --locked-mode
      - run: dotnet build tools/reference-dotnet/Reference.csproj --no-restore -c Release
      - run: node scripts/check-dotnet.cjs
      - run: node scripts/check-kv3.cjs
      - run: node scripts/fuzz.cjs
      - run: node scripts/check-upstream.cjs
      - run: node scripts/test-registry.cjs 0.4.0
      - run: moon package --list
      - run: python3 scripts/check-publish.py
